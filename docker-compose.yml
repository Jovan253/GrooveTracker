# Shell only — services are sketched here but not yet buildable/runnable.
# Dockerfiles land in 001.6 (backend) / 001.9 (frontend); this file is
# wired up and verified end-to-end in 001.10.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # TODO (001.10): healthcheck so backend waits for db to accept connections

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # Fixed inside the container; BACKEND_PORT only picks the host port below.
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    # TODO (001.6): Dockerfile runs `npm run migrate` then starts the server

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    # TODO (001.9): multi-stage build, nginx serves the static bundle on :80

volumes:
  db_data:
