# Served by frontend/Dockerfile's serve stage as
# /etc/nginx/conf.d/default.conf, replacing the stock nginx welcome-page
# config.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try the requested file, then a matching directory, then fall back
        # to index.html. That fallback is what makes client-side routes
        # (e.g. /albums/5) work on a hard refresh or a direct link once we
        # add a router — nginx would otherwise 404 on any path that isn't a
        # real static file. We have no router today, so this only ever
        # falls through for genuinely missing files, but it's the standard,
        # cheap-to-set-up-now SPA config.
        try_files $uri $uri/ /index.html;
    }
}
